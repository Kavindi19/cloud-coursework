services:
  postgres:
    image: postgres:16
    container_name: event-postgres

    environment:
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpassword
      POSTGRES_DB: eventdb

    ports:
      - "5432:5432"

    volumes:
      - event_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventuser -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: event-api

    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://eventuser:eventpassword@postgres:5432/eventdb?schema=public

    ports:
      - "3001:3001"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npm start"
      ]

volumes:
  event_postgres_data:
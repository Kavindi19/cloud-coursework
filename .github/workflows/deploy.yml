name: Cloud Native Event Platform CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "event-service/**"
      - "k8s/event-blue-deployment.yaml"
      - "k8s/event-green-deployment.yaml"
      - "k8s/event-service.yaml"
      - ".github/workflows/event-service-blue-green.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Application Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            kavindinable/event-frontend:latest
            kavindinable/event-frontend:${{ env.IMAGE_TAG }}

      - name: Build and push program service
        uses: docker/build-push-action@v6
        with:
          context: ./program-service
          file: ./program-service/Dockerfile
          push: true
          tags: |
            kavindinable/program-service:latest
            kavindinable/program-service:${{ env.IMAGE_TAG }}

      - name: Build and push registration service
        uses: docker/build-push-action@v6
        with:
          context: ./registration-service
          file: ./registration-service/Dockerfile
          push: true
          tags: |
            kavindinable/registration-service:latest
            kavindinable/registration-service:${{ env.IMAGE_TAG }}

      - name: Build and push analytics service
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          file: ./analytics/Dockerfile
          push: true
          tags: |
            kavindinable/analytics-service:latest
            kavindinable/analytics-service:${{ env.IMAGE_TAG }}

      - name: Display successful image versions
        run: |
          echo "Application images were pushed successfully."
          echo "Deployment image tag: $IMAGE_TAG"
          echo "Event Service is handled by event-service-blue-green.yml."

  deploy-to-eks:
    name: Deploy to Amazon EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Verify cluster connection
        run: |
          kubectl get nodes
          kubectl get deployments -n coursework

      - name: Update frontend
        run: |
          kubectl set image deployment/event-frontend \
            event-frontend=kavindinable/event-frontend:${{ env.IMAGE_TAG }} \
            -n coursework

      - name: Update program service
        run: |
          kubectl set image deployment/program-service \
            program-service=kavindinable/program-service:${{ env.IMAGE_TAG }} \
            -n coursework

      - name: Update registration service
        run: |
          kubectl set image deployment/registration-service \
            registration-service=kavindinable/registration-service:${{ env.IMAGE_TAG }} \
            -n coursework

      - name: Update analytics service
        run: |
          kubectl set image deployment/analytics-service \
            analytics-service=kavindinable/analytics-service:${{ env.IMAGE_TAG }} \
            -n coursework

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/event-frontend \
            -n coursework \
            --timeout=180s

      - name: Wait for program service rollout
        run: |
          kubectl rollout status deployment/program-service \
            -n coursework \
            --timeout=180s

      - name: Wait for registration service rollout
        run: |
          kubectl rollout status deployment/registration-service \
            -n coursework \
            --timeout=180s

      - name: Wait for analytics service rollout
        run: |
          kubectl rollout status deployment/analytics-service \
            -n coursework \
            --timeout=180s

      - name: Verify deployments
        run: |
          echo "Current deployments:"
          kubectl get deployments -n coursework

          echo ""
          echo "Current pods:"
          kubectl get pods -n coursework

          echo ""
          echo "Current Event Service colour:"
          kubectl get service event-service \
            -n coursework \
            -o jsonpath='{.spec.selector.version}'

          echo ""
name: Cloud Native Event Platform CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            kavindinable/event-frontend:latest
            kavindinable/event-frontend:${{ env.IMAGE_TAG }}

      - name: Build and push event service
        uses: docker/build-push-action@v6
        with:
          context: ./event-service
          file: ./event-service/Dockerfile
          push: true
          tags: |
            kavindinable/event-service:latest
            kavindinable/event-service:${{ env.IMAGE_TAG }}

      - name: Build and push program service
        uses: docker/build-push-action@v6
        with:
          context: ./program-service
          file: ./program-service/Dockerfile
          push: true
          tags: |
            kavindinable/program-service:latest
            kavindinable/program-service:${{ env.IMAGE_TAG }}

      - name: Build and push registration service
        uses: docker/build-push-action@v6
        with:
          context: ./registration-service
          file: ./registration-service/Dockerfile
          push: true
          tags: |
            kavindinable/registration-service:latest
            kavindinable/registration-service:${{ env.IMAGE_TAG }}

      - name: Build and push analytics service
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          file: ./analytics/Dockerfile
          push: true
          tags: |
            kavindinable/analytics-service:latest
            kavindinable/analytics-service:${{ env.IMAGE_TAG }}

      - name: Display successful image versions
        run: |
          echo "All images were pushed successfully."
          echo "Deployment image tag: $IMAGE_TAG"

  deploy-to-eks:
    name: Deploy to Amazon EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Verify cluster connection
        run: |
          kubectl get nodes
          kubectl get deployments -n coursework

      - name: Update Frontend
        run: |
          kubectl set image deployment/event-frontend \
          event-frontend=kavindinable/event-frontend:${{ env.IMAGE_TAG }} \
          -n coursework

      - name: Update Event Service
        run: |
          kubectl set image deployment/event-service \
          event-service=kavindinable/event-service:${{ env.IMAGE_TAG }} \
          -n coursework

      - name: Update Program Service
        run: |
          kubectl set image deployment/program-service \
          program-service=kavindinable/program-service:${{ env.IMAGE_TAG }} \
          -n coursework

      - name: Update Registration Service
        run: |
          kubectl set image deployment/registration-service \
          registration-service=kavindinable/registration-service:${{ env.IMAGE_TAG }} \
          -n coursework

      - name: Update Analytics Service
        run: |
          kubectl set image deployment/analytics-service \
          analytics-service=kavindinable/analytics-service:${{ env.IMAGE_TAG }} \
          -n coursework

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/event-frontend -n coursework
          kubectl rollout status deployment/event-service -n coursework
          kubectl rollout status deployment/program-service -n coursework
          kubectl rollout status deployment/registration-service -n coursework
          kubectl rollout status deployment/analytics-service -n coursework

      - name: Verify Deployment
        run: |
          kubectl get pods -n coursework
          kubectl get deployments -n coursework
          kubectl get services -n coursework
          kubectl get ingress -n coursework